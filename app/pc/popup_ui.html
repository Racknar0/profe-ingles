<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Profe Inglés — Entrenador</title>
  <style>
    :root {
      --bg-1: #090d16;
      --bg-2: #111827;
      --card: rgba(30, 41, 59, 0.78);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #34d399;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #1e293b 0%, var(--bg-1) 65%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 28px;
      overflow-x: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 999px;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.25);
    }

    .dot.filled {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
    }

    .card {
      flex: 1;
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .prompt-label {
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      margin: 0;
    }

    .question {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
      color: #ffffff;
    }

    .answer-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 18px;
      padding: 20px 22px;
      animation: fadeIn 0.22s ease-out;
    }

    .answer-box.hidden { display: none; }

    .answer-en {
      font-size: 23px;
      font-weight: 700;
      color: var(--success);
      margin: 0 0 10px;
      line-height: 1.35;
      user-select: text;
    }

    .extra {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.55;
      white-space: pre-line;
      margin: 0;
    }

    .block-chip {
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .block-fon {
      color: var(--accent);
      font-size: 14px;
      margin-top: 3px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease, background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #082f49;
      box-shadow: 0 6px 20px var(--accent-glow);
      padding: 14px 26px;
      font-size: 16px;
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-success {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #022c22;
      padding: 14px 22px;
      font-size: 16px;
    }

    .btn-warn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #451a03;
      padding: 14px 22px;
      font-size: 16px;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 11px 15px;
      font-size: 14px;
    }

    .hidden { display: none !important; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span id="tag-pill" class="pill">Cargando...</span>
    <div class="meta-right">
      <span id="round-counter">1 / 2</span>
      <div id="level-dots" class="dots" title="Nivel de dominio (0-5)"></div>
    </div>
  </header>

  <main class="card">
    <p class="prompt-label">¿Cómo lo dices en inglés?</p>
    <h1 id="question" class="question">—</h1>

    <div id="answer-box" class="answer-box hidden">
      <p id="answer-en" class="answer-en"></p>
      <div id="extra" class="extra"></div>
    </div>
  </main>

  <footer class="controls">
    <div class="btn-group">
      <button id="btn-reveal" class="btn-primary" type="button">👀 Ver respuesta</button>
      <button id="btn-ok" class="btn-success hidden" type="button">✅ Lo dominé</button>
      <button id="btn-repasar" class="btn-warn hidden" type="button">🔁 Repasar</button>
      <button id="btn-audio" class="btn-secondary" type="button">🔊 Escuchar</button>
      <button id="btn-slow" class="btn-secondary" type="button">🐢 0.75x</button>
    </div>

    <div class="btn-group">
      <button id="btn-10m" class="btn-ghost" type="button">⏰ 10 min</button>
      <button id="btn-later" class="btn-ghost" type="button">⏸ Posponer</button>
    </div>
  </footer>

  <script>
    let state = { items: [], index: 0, intervalo: 45 };

    function speak(text, rate = 1.0) {
      if (!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = rate;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => x.lang.startsWith("en-US")) || voices.find(x => x.lang.startsWith("en"));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    }

    function renderDots(level) {
      const el = document.getElementById("level-dots");
      el.innerHTML = "";
      for (let i = 1; i <= 5; i++) {
        const d = document.createElement("span");
        d.className = "dot" + (i <= level ? " filled" : "");
        el.appendChild(d);
      }
    }

    function renderCurrent() {
      const item = state.items[state.index];
      if (!item) return finishRound();

      document.getElementById("tag-pill").textContent = `${item.tipo} · Día ${item.dia} (${item.episodio})`;
      document.getElementById("round-counter").textContent = `${state.index + 1} de ${state.items.length}`;
      document.getElementById("question").textContent = item.pregunta;
      document.getElementById("answer-en").textContent = item.respuesta;
      renderDots(item.nivel || 0);

      const extraEl = document.getElementById("extra");
      extraEl.innerHTML = "";
      if (item.bloques && item.bloques.length) {
        item.bloques.forEach(b => {
          const div = document.createElement("div");
          div.className = "block-chip";
          div.innerHTML = `<div>${b.en}</div><div class="block-fon">${b.fonetica}</div>`;
          extraEl.appendChild(div);
        });
      } else if (item.extra) {
        extraEl.textContent = item.extra;
      }

      document.getElementById("answer-box").classList.add("hidden");
      document.getElementById("btn-reveal").classList.remove("hidden");
      document.getElementById("btn-ok").classList.add("hidden");
      document.getElementById("btn-repasar").classList.add("hidden");
    }

    function reveal() {
      const item = state.items[state.index];
      if (!item) return;
      document.getElementById("answer-box").classList.remove("hidden");
      document.getElementById("btn-reveal").classList.add("hidden");
      document.getElementById("btn-ok").classList.remove("hidden");
      document.getElementById("btn-repasar").classList.remove("hidden");
      speak(item.respuesta, 1.0);
    }

    async function rate(delta) {
      const item = state.items[state.index];
      await fetch("/api/rate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id, delta })
      });
      state.index += 1;
      if (state.index < state.items.length) {
        renderCurrent();
      } else {
        finishRound();
      }
    }

    async function finishRound(minutos = null) {
      await fetch("/api/postpone", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ minutos })
      });
      window.close();
    }

    document.getElementById("btn-reveal").addEventListener("click", reveal);
    document.getElementById("btn-audio").addEventListener("click", () => {
      const item = state.items[state.index];
      if (item) speak(item.respuesta, 1.0);
    });
    document.getElementById("btn-slow").addEventListener("click", () => {
      const item = state.items[state.index];
      if (item) speak(item.respuesta, 0.75);
    });
    document.getElementById("btn-ok").addEventListener("click", () => rate(1));
    document.getElementById("btn-repasar").addEventListener("click", () => rate(-1));
    document.getElementById("btn-10m").addEventListener("click", () => finishRound(10));
    document.getElementById("btn-later").addEventListener("click", () => finishRound(null));

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !document.getElementById("btn-reveal").classList.contains("hidden")) {
        e.preventDefault();
        reveal();
      }
    });

    fetch("/api/ronda")
      .then(r => r.json())
      .then(data => {
        state.items = data.items || [];
        state.intervalo = data.intervalo_minutos || 45;
        document.getElementById("btn-later").textContent = `⏸ ${state.intervalo} min`;
        renderCurrent();
      });
  </script>
</body>
</html>
