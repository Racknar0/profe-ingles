<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Profe Inglés — Entrenador</title>
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #050b16;
      --bg-navy: #091529;
      --panel: rgba(11, 23, 44, 0.85);
      --border: rgba(56, 189, 248, 0.22);
      --border-soft: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #8da2be;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --success: #34d399;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 20%, rgba(14, 116, 144, 0.22), transparent 45%),
        radial-gradient(circle at 82% 80%, rgba(56, 189, 248, 0.14), transparent 50%),
        linear-gradient(160deg, var(--bg-navy) 0%, var(--bg-deep) 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 26px 22px;
      overflow-x: hidden;
    }

    /* Topbar 3 zonas */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .pill {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(12, 28, 52, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.42);
      color: #bae6fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.12);
    }

    /* Stepper central 1 - 2 - 3 */
    .stepper {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .step-node {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid rgba(148, 163, 184, 0.32);
      color: var(--muted);
      background: rgba(10, 20, 38, 0.9);
      transition: all 0.2s ease;
    }

    .step-node.done {
      background: var(--success);
      border-color: var(--success);
      color: #022c22;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
    }

    .step-node.active {
      border-color: var(--accent);
      color: #ffffff;
      background: rgba(56, 189, 248, 0.22);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.55);
    }

    .step-line {
      width: 44px;
      height: 2px;
      background: rgba(148, 163, 184, 0.25);
    }

    .step-line.done {
      background: linear-gradient(90deg, var(--success), var(--accent));
    }

    .interval-wrap {
      justify-self: end;
    }

    .interval-select {
      font-family: inherit;
      background: rgba(12, 28, 52, 0.9);
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .interval-select:hover { border-color: var(--accent); }

    /* Grid principal 2 columnas */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 18px;
      align-items: stretch;
    }

    .card-main {
      position: relative;
      background:
        radial-gradient(circle at 85% 95%, rgba(56, 189, 248, 0.18), transparent 45%),
        linear-gradient(155deg, rgba(16, 36, 68, 0.85), rgba(8, 18, 36, 0.92));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .card-main::after {
      content: "";
      position: absolute;
      inset: auto -20% -30% 35%;
      height: 120px;
      background: radial-gradient(ellipse, rgba(56, 189, 248, 0.22), transparent 70%);
      pointer-events: none;
    }

    .prompt-label {
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    .question {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
      color: #ffffff;
    }

    .answer-box {
      margin-top: 20px;
      background: rgba(5, 13, 28, 0.72);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 16px;
      padding: 18px 20px;
      animation: fadeIn 0.22s ease-out;
    }

    .answer-en {
      font-size: 21px;
      font-weight: 700;
      color: var(--success);
      margin: 0 0 8px;
      line-height: 1.35;
      user-select: text;
    }

    .extra {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-line;
      margin: 0;
    }

    .block-chip {
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .block-fon {
      color: var(--accent);
      font-size: 13px;
      margin-top: 3px;
    }

    .formula-box {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.42);
      color: #7dd3fc;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 16px;
      font-weight: 700;
    }

    .gram-example {
      background: rgba(5, 13, 28, 0.68);
      border-left: 3px solid var(--success);
      border-radius: 10px;
      padding: 9px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .gram-example-en { font-size: 15px; font-weight: 600; color: #f8fafc; margin: 0; }
    .gram-example-es { font-size: 12px; color: var(--muted); margin: 2px 0 0; }

    /* Panel derecho: TU PROGRESO */
    .card-side {
      background: rgba(10, 22, 42, 0.85);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .side-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      margin: 0;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .ring-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .ring-wrap svg { transform: rotate(-90deg); }

    .ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-label { font-size: 12px; color: var(--muted); margin: 0; }
    .stat-val { font-size: 20px; font-weight: 700; color: var(--success); margin: 2px 0 0; display: flex; align-items: center; gap: 8px; }
    .stat-sub { font-size: 12px; color: #cbd5e1; margin: 2px 0 0; }

    .mini-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: var(--success);
    }

    .tip-box {
      background: rgba(15, 29, 54, 0.7);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .tip-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(251, 191, 36, 0.14);
      color: var(--warn);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .tip-title { font-size: 12px; font-weight: 700; color: #f8fafc; margin: 0 0 2px; }
    .tip-text { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }

    /* Footer de botones */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-group { display: flex; gap: 10px; align-items: center; }

    button {
      font-family: inherit;
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button:active { transform: translateY(0); }

    .btn-hero {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #06283d;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 32px;
      box-shadow: 0 8px 26px rgba(56, 189, 248, 0.35);
    }

    .btn-secondary {
      background: rgba(20, 38, 68, 0.85);
      color: #e2e8f0;
      border: 1px solid var(--border-soft);
    }

    .btn-success {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #022c22;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 22px;
    }

    .btn-warn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #451a03;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 22px;
    }

    .btn-ghost {
      background: rgba(15, 29, 54, 0.7);
      color: var(--muted);
      border: 1px solid var(--border-soft);
      padding: 11px 14px;
      font-size: 13px;
    }

    .hidden { display: none !important; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span id="tag-pill" class="pill">Cargando...</span>

    <div id="stepper" class="stepper">
      <div class="step-node active" id="step-1">1</div>
      <div class="step-line" id="line-1"></div>
      <div class="step-node" id="step-2">2</div>
      <div class="step-line" id="line-2"></div>
      <div class="step-node" id="step-3">3</div>
    </div>

    <div class="interval-wrap">
      <select id="interval-select" class="interval-select" title="Frecuencia del recordatorio">
        <option value="15">⏱ 15:00</option>
        <option value="30">⏱ 30:00</option>
        <option value="45">⏱ 45:00</option>
        <option value="60">⏱ 60:00</option>
      </select>
    </div>
  </header>

  <section class="main-grid">
    <main class="card-main">
      <div id="quiz-body">
        <p id="prompt-label" class="prompt-label">¿Cómo lo dices en inglés?</p>
        <h1 id="question" class="question">—</h1>

        <div id="answer-box" class="answer-box hidden">
          <p id="answer-en" class="answer-en"></p>
          <div id="extra" class="extra"></div>
        </div>
      </div>

      <div id="gram-body" class="hidden" style="display:flex;flex-direction:column;gap:12px;">
        <p class="prompt-label">💊 Píldora Gramatical · 2 min</p>
        <h1 id="gram-title" class="question" style="font-size:22px;">—</h1>
        <p id="gram-uso" class="extra"></p>
        <div id="gram-formula" class="formula-box"></div>
        <div id="gram-examples" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </main>

    <aside class="card-side">
      <p class="side-title">Tu Progreso</p>

      <div class="stat-row">
        <div class="icon-badge">🎙️</div>
        <div>
          <p class="stat-label">Dominio actual</p>
          <div class="stat-val">
            <span id="mastery-pct">0%</span>
            <span id="mastery-badge" class="mini-tag">Nuevo</span>
          </div>
        </div>
      </div>

      <div class="stat-row">
        <div class="ring-wrap">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle cx="26" cy="26" r="21" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="5" />
            <circle id="ring-circle" cx="26" cy="26" r="21" fill="none" stroke="#34d399" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="131.95" stroke-dashoffset="88" />
          </svg>
          <span id="ring-pct" class="ring-text">33%</span>
        </div>
        <div>
          <p class="stat-label" style="color:#f8fafc;font-weight:600;">Ronda en curso</p>
          <p id="round-counter" class="stat-sub">1 de 3 ejercicios</p>
        </div>
      </div>

      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div>
          <p class="tip-title">Tip rápido</p>
          <p id="tip-text" class="tip-text">Dilo en voz alta antes de revelar para entrenar el músculo vocal.</p>
        </div>
      </div>
    </aside>
  </section>

  <footer class="controls">
    <div class="btn-group">
      <button id="btn-audio" class="btn-secondary" type="button">🔊 Escuchar</button>
      <button id="btn-slow" class="btn-secondary" type="button">🐢 0.75x</button>
    </div>

    <div class="btn-group">
      <button id="btn-reveal" class="btn-hero" type="button">✓ Ver respuesta</button>
      <button id="btn-ok" class="btn-success hidden" type="button">✅ Lo dominé</button>
      <button id="btn-repasar" class="btn-warn hidden" type="button">🔁 Repasar</button>
      <button id="btn-gram-done" class="btn-hero hidden" type="button">✅ Leído, listo</button>
    </div>

    <div class="btn-group">
      <button id="btn-10m" class="btn-ghost" type="button">⏰ 10m</button>
      <button id="btn-later" class="btn-ghost" type="button">⏸ 45m</button>
    </div>
  </footer>

  <script>
    let state = { items: [], index: 0, intervalo: 45 };

    function speak(text, rate = 1.0) {
      if (!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = rate;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => x.lang.startsWith("en-US")) || voices.find(x => x.lang.startsWith("en"));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    }

    function updateStepper(idx, total) {
      for (let i = 1; i <= 3; i++) {
        const node = document.getElementById(`step-${i}`);
        const line = document.getElementById(`line-${i}`);
        node.classList.remove("done", "active");
        if (i < idx + 1) {
          node.classList.add("done");
          node.textContent = "✓";
          if (line) line.classList.add("done");
        } else if (i === idx + 1) {
          node.classList.add("active");
          node.textContent = String(i);
          if (line) line.classList.remove("done");
        } else {
          node.textContent = String(i);
          if (line) line.classList.remove("done");
        }
      }

      const pct = Math.round(((idx + 1) / Math.max(1, total)) * 100);
      const circ = 131.95;
      document.getElementById("ring-circle").style.strokeDashoffset = String(circ * (1 - pct / 100));
      document.getElementById("ring-pct").textContent = `${pct}%`;
      document.getElementById("round-counter").textContent = `${idx + 1} de ${total} ejercicios`;
    }

    function updateMastery(level) {
      const pct = Math.round((level / 5) * 100);
      document.getElementById("mastery-pct").textContent = `${pct}%`;
      const labels = ["Nuevo", "Inicial", "En progreso", "Sólido", "Avanzado", "Dominado"];
      document.getElementById("mastery-badge").textContent = labels[level] || "Nuevo";
    }

    function renderCurrent() {
      const item = state.items[state.index];
      if (!item) return finishRound();

      document.getElementById("tag-pill").textContent = `${item.tipo} · Día ${item.dia} (${item.episodio})`;
      updateStepper(state.index, state.items.length);
      updateMastery(item.nivel || 0);

      const quizBody = document.getElementById("quiz-body");
      const gramBody = document.getElementById("gram-body");

      if (item.es_gramatica) {
        quizBody.classList.add("hidden");
        gramBody.classList.remove("hidden");
        document.getElementById("gram-title").textContent = item.titulo;
        document.getElementById("gram-uso").textContent = item.uso;
        document.getElementById("gram-formula").textContent = item.formula;
        document.getElementById("tip-text").textContent = "Lee la fórmula y escucha los 2 ejemplos para fijar la estructura.";

        const exWrap = document.getElementById("gram-examples");
        exWrap.innerHTML = "";
        (item.ejemplos || []).forEach(ex => {
          const row = document.createElement("div");
          row.className = "gram-example";
          row.innerHTML = `<div><p class="gram-example-en">${ex.en}</p><p class="gram-example-es">${ex.es}</p></div>`;
          const btn = document.createElement("button");
          btn.className = "btn-secondary";
          btn.type = "button";
          btn.style.padding = "7px 11px";
          btn.textContent = "🔊";
          btn.addEventListener("click", () => speak(ex.en, 1.0));
          row.appendChild(btn);
          exWrap.appendChild(row);
        });

        document.getElementById("btn-reveal").classList.add("hidden");
        document.getElementById("btn-ok").classList.add("hidden");
        document.getElementById("btn-repasar").classList.add("hidden");
        document.getElementById("btn-audio").classList.add("hidden");
        document.getElementById("btn-slow").classList.add("hidden");
        document.getElementById("btn-gram-done").classList.remove("hidden");
        return;
      }

      gramBody.classList.add("hidden");
      quizBody.classList.remove("hidden");
      document.getElementById("btn-audio").classList.remove("hidden");
      document.getElementById("btn-slow").classList.remove("hidden");
      document.getElementById("btn-gram-done").classList.add("hidden");

      const isShadowing = item.tipo.startsWith("Shadowing");
      document.getElementById("prompt-label").textContent = isShadowing
        ? "Shadowing · ¿Cómo suena en inglés?"
        : "¿Cómo lo dices en inglés?";
      document.getElementById("tip-text").textContent = isShadowing
        ? "Conecta las palabras sin pausar entre bloques, igual que en el episodio."
        : "Dilo en voz alta antes de revelar para entrenar tu memoria activa.";

      document.getElementById("question").textContent = item.pregunta;
      document.getElementById("answer-en").textContent = item.respuesta;

      const extraEl = document.getElementById("extra");
      extraEl.innerHTML = "";
      if (item.bloques && item.bloques.length) {
        item.bloques.forEach(b => {
          const div = document.createElement("div");
          div.className = "block-chip";
          div.innerHTML = `<div>${b.en}</div><div class="block-fon">${b.fonetica}</div>`;
          extraEl.appendChild(div);
        });
      } else if (item.extra) {
        const pEn = document.createElement("div");
        pEn.textContent = item.extra;
        extraEl.appendChild(pEn);
        if (item.extra_es) {
          const pEs = document.createElement("div");
          pEs.style.color = "#7dd3fc";
          pEs.style.fontSize = "13px";
          pEs.style.marginTop = "4px";
          pEs.textContent = item.extra_es;
          extraEl.appendChild(pEs);
        }
      }

      document.getElementById("answer-box").classList.add("hidden");
      document.getElementById("btn-reveal").classList.remove("hidden");
      document.getElementById("btn-ok").classList.add("hidden");
      document.getElementById("btn-repasar").classList.add("hidden");
    }

    function reveal() {
      const item = state.items[state.index];
      if (!item) return;
      document.getElementById("answer-box").classList.remove("hidden");
      document.getElementById("btn-reveal").classList.add("hidden");
      document.getElementById("btn-ok").classList.remove("hidden");
      document.getElementById("btn-repasar").classList.remove("hidden");
      speak(item.respuesta, 1.0);
    }

    async function rate(delta) {
      const item = state.items[state.index];
      await fetch("/api/rate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id, delta })
      });
      state.index += 1;
      if (state.index < state.items.length) {
        renderCurrent();
      } else {
        finishRound();
      }
    }

    async function finishRound(minutos = null) {
      await fetch("/api/postpone", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ minutos })
      });
      window.close();
    }

    document.getElementById("btn-reveal").addEventListener("click", reveal);
    document.getElementById("btn-audio").addEventListener("click", () => {
      const item = state.items[state.index];
      if (item) speak(item.respuesta, 1.0);
    });
    document.getElementById("btn-slow").addEventListener("click", () => {
      const item = state.items[state.index];
      if (item) speak(item.respuesta, 0.75);
    });
    document.getElementById("btn-ok").addEventListener("click", () => rate(1));
    document.getElementById("btn-repasar").addEventListener("click", () => rate(-1));
    document.getElementById("btn-gram-done").addEventListener("click", () => rate(1));
    document.getElementById("btn-10m").addEventListener("click", () => finishRound(10));
    document.getElementById("btn-later").addEventListener("click", () => finishRound(null));

    document.getElementById("interval-select").addEventListener("change", async (e) => {
      const mins = Number(e.target.value);
      state.intervalo = mins;
      document.getElementById("btn-later").textContent = `⏸ ${mins}m`;
      await fetch("/api/intervalo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ minutos: mins })
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !document.getElementById("btn-reveal").classList.contains("hidden")) {
        e.preventDefault();
        reveal();
      }
    });

    fetch("/api/ronda")
      .then(r => r.json())
      .then(data => {
        state.items = data.items || [];
        state.intervalo = data.intervalo_minutos || 45;
        document.getElementById("interval-select").value = String(state.intervalo);
        document.getElementById("btn-later").textContent = `⏸ ${state.intervalo}m`;
        renderCurrent();
      });
  </script>
</body>
</html>
